name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov mypy interrogate build pydantic
        pip install "cdd @ git+https://github.com/offscale/cdd-python.git@master"
        pip install -r requirements.txt
        pip install --no-deps "ml-ecosystem-snapshots @ https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.5/ml_ecosystem_snapshots-0.0.5-py3-none-any.whl"
        pip install -e .

    - name: Check Code Formatting (Ruff)
      run: ruff format --check src scripts tests

    - name: Check Linting (Ruff)
      run: ruff check src scripts tests

    - name: Check Static Typing (Mypy Strict)
      run: mypy --strict src scripts tests

    - name: Check Docstring Coverage (Interrogate)
      run: interrogate -v -f 100 src scripts tests

    - name: Check Argument & Function Docstrings
      run: python scripts/check_docstrings.py

    - name: Check Forbidden Typing & Reflection Hacks
      run: python scripts/lint_typing_and_hacks.py

    - name: Check Disallowed Third-Party Dependencies
      run: python scripts/check_dependencies.py

    - name: Check API & Signature Compliance (100%)
      run: python scripts/check_compliance.py

    - name: Test & Coverage (100% Line, Branch, Function)
      run: |
        pytest --cov=src/zero_pax --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=100

    - name: Build Package
      run: python -m build
