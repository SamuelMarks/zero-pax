repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: ruff format .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: Ruff Check (Fix)
        entry: ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false

      - id: check-dependencies
        name: Check Dependencies
        entry: python3 scripts/check_dependencies.py
        language: system
        types: [python]
        exclude: ^(tests/|scripts/)

      - id: build
        name: Build Package
        entry: python3 -m build
        language: system
        pass_filenames: false
