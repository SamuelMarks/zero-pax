repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: ruff format --check src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: Ruff Check
        entry: ruff check src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: Mypy Strict Type Check
        entry: mypy --strict src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: interrogate
        name: Interrogate Docstring Coverage
        entry: interrogate -v -f 100 src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: check-dependencies
        name: Check Disallowed Dependencies
        entry: python3 scripts/check_dependencies.py
        language: system
        types: [python]
        pass_filenames: false

      - id: lint-typing-and-hacks
        name: Lint Typing and Reflection Hacks
        entry: python3 scripts/lint_typing_and_hacks.py
        language: system
        types: [python]
        pass_filenames: false

      - id: check-docstrings
        name: Check Argument and Function Docstrings
        entry: python3 scripts/check_docstrings.py
        language: system
        types: [python]
        pass_filenames: false

      - id: check-compliance
        name: Check ml-ecosystem-snapshots v0.0.5 and Semantic Plan Compliance
        entry: python3 scripts/check_compliance.py
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: Pytest with 100% Line and Branch Coverage
        entry: pytest --cov=src/zero_pax --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100
        language: system
        types: [python]
        pass_filenames: false

      - id: build
        name: Build Package
        entry: python3 -m build
        language: system
        pass_filenames: false
